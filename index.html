  var slots = [];

}

function AdminDashboard(props) {
  var bookings = props.bookings;
  var services = props.services;
  var today = new Date();
  var todayStr = today.toISOString().split("T")[0];

  var todayBookings = bookings.filter(function(b) { return b.date === todayStr; });
  var pendingCount = bookings.filter(function(b) { return b.status === "pending"; }).length;
  var thisWeek = bookings.filter(function(b) {
    var d = new Date(b.date);
    var diff = (d - today) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff < 7;
  });
  var revenue = bookings.filter(function(b) { return b.status === "confirmed"; }).reduce(function(sum, b) {
    var sv = services.find(function(x) { return x.id === b.serviceId; });
    return sum + (sv ? sv.price : 0);
  }, 0);

  return e("div", null,
    e("h2", { style: s.sectionTitle }, "Dashboard"),
    e("div", { style: { display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:12, marginBottom:20 } },
      e("div", { style: a.stat },
        e("div", { style: a.statNum }, todayBookings.length),
        e("div", { style: a.statLabel }, "Today's Bookings")
      ),
      e("div", { style: a.stat },
        e("div", { style: a.statNum }, pendingCount),
        e("div", { style: a.statLabel }, "Pending")
      ),
      e("div", { style: a.stat },
        e("div", { style: a.statNum }, thisWeek.length),
        e("div", { style: a.statLabel }, "This Week")
      ),
      e("div", { style: a.stat },
        e("div", { style: a.statNum }, fmtPrice(revenue)),
        e("div", { style: a.statLabel }, "Total Revenue")

      e("h3", { style: a.cardTitle }, "Today's Appointments"),

function AdminServices(props) {
  var services = props.services;
  var setServices = props.setServices;
  var editing = useState(null); var editSv = editing[0]; var setEditSv = editing[1];
  var adding = useState(false); var isAdding = adding[0]; var setIsAdding = adding[1];

  var blank = { id: Date.now(), name: "", duration: "", durationMin: 60, price: 0, category: "nails", desc: "", icon: "\u{1F485}", active: true };

  function saveSv(sv) {
    sv.duration = fmtDuration(sv.durationMin);
    var idx = services.findIndex(function(x) { return x.id === sv.id; });
    var next;
    if (idx >= 0) { next = services.slice(); next[idx] = sv; }
    else { next = services.concat([sv]); }
    setServices(next);
    saveData("services", next);
    setEditSv(null);
    setIsAdding(false);
  }

  function deleteSv(id) {
    var next = services.filter(function(x) { return x.id !== id; });
    setServices(next);
    saveData("services", next);
  }

  function toggleActive(id) {
    var next = services.map(function(x) { return x.id === id ? Object.assign({}, x, { active: !x.active }) : x; });
    setServices(next);
    saveData("services", next);
  }

  if (editSv || isAdding) {
    var sv = editSv || blank;
    return e(ServiceEditor, { service: sv, onSave: saveSv, onCancel: function() { setEditSv(null); setIsAdding(false); } });
  }

  return e("div", null,
    e("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 } },
      e("h2", { style: { ...s.sectionTitle, margin:0 } }, "Services"),
      e("button", { onClick: function() { setIsAdding(true); }, style: a.btnPrimary }, "+ Add Service")
    ),
    services.map(function(sv) {
      return e("div", { key: sv.id, style: { ...a.bookingCard, opacity: sv.active ? 1 : 0.5 } },
        e("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"center" } },
          e("div", { style: { display:"flex", alignItems:"center", gap:12 } },
            e("span", { style: { fontSize:24 } }, sv.icon),
            e("div", null,
              e("div", { style: { fontWeight:600, fontSize:15 } }, sv.name),
              e("div", { style: { fontSize:12, color:"var(--fg-muted)" } }, sv.duration + " · " + fmtPrice(sv.price))
            )
          ),
          e("div", { style: { display:"flex", gap:6, flexShrink:0 } },
            e("button", { onClick: function() { toggleActive(sv.id); }, style: a.btnSm }, sv.active ? "Hide" : "Show"),
            e("button", { onClick: function() { setEditSv(Object.assign({}, sv)); }, style: a.btnSm }, "Edit"),
            e("button", { onClick: function() { if(confirm("Delete "+sv.name+"?")) deleteSv(sv.id); }, style: a.btnDanger }, "×")
          )
        )
      );
    })
  );
}

        e("p", { style: { fontSize:12, color:"var(--fg-faint)", marginTop:16, textAlign:"center", fontWeight:300 } }, "You'll receive a reminder 24 hours before"),
        e("button", { onClick: resetAll, style: s.btnSecondary }, "Back to Home")
      ),
      e(Footer)
    );
  }

  return e("div", { style: { display:"flex", flexDirection:"column", minHeight:"100vh" } },
    e(Particles),

    e("header", { style: s.header },
      e("div", { style: s.logoArea },
        e("div", { style: s.logoCircle }, e("img", { src: LOGO_B64, alt:"Nail Studio by Abigail", style: s.logoImg })),
        e("div", null,
          e("h1", { style: s.brandName }, settings.businessName || "abigaillnails"),
          e("p", { style: s.tagline }, settings.tagline || "Stokenchurch")
        )
      ),
      view !== "home" && e("button", { onClick: goBack, style: s.backBtn }, "← Back")
    ),

    view === "home" && e("div", { style: s.content },
      e("div", { style: s.heroBanner, className:"fade-up" },
        e("h2", { style: s.heroScript }, "nails by Abigail"),
        e("p", { style: s.heroTitle }, "home-based nail care"),
        e("div", { style: s.heroLine })
      ),
      e("div", { style: { marginBottom:8 }, className:"fade-up fade-up-1" },
        e("button", { onClick: function() { setView("services"); }, style: s.primaryAction },
          e("span", { style: { fontSize:16 } }, "Book Your Appointment"),
          e("span", { style: { fontSize:20 } }, "→")
        )
      ),
      e(Divider),
      e("div", { style: s.infoCards },
        e("div", { style: s.infoCard, className:"fade-up fade-up-2" },
          e("div", { style: s.infoIcon }, "\u{1F4CD}"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Location"),
            e("p", { style: s.infoText }, "Home-based in Stokenchurch, Buckinghamshire. Address shared upon booking.")
          )
        ),
        e("div", { style: s.infoCard, className:"fade-up fade-up-3" },
          e("div", { style: s.infoIcon }, "⏰"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Opening Hours"),
            e("p", { style: s.infoText }, (function() {
              var openDays = [];
              for (var i = 0; i < 7; i++) { if (availability.days[i]) openDays.push(DAYS[i]); }
              return openDays.join(", ") + ", " + availability.startTime + "–" + availability.endTime + ". Appointments only.";
            })())
          )
        ),
        e("div", { style: s.infoCard, className:"fade-up fade-up-4" },
          e("div", { style: s.infoIcon }, "\u{1F4AC}"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Get in Touch"),
            e("p", { style: s.infoText }, "WhatsApp for enquiries, changes, or cancellations.")
          )
        )
      ),
      e("div", { style: s.policyBox, className:"fade-up fade-up-5" },
        e("p", { style: s.policyTitle }, "Booking Policy"),
        e("p", { style: s.policyText }, settings.cancellationPolicy)
      )
    ),

    view === "services" && e("div", { style: s.content },
      e("h2", { style: s.sectionTitle }, "Choose a Service"),
      e("div", { style: s.serviceList },
        services.map(function(sv, idx) {
          return e("button", {
            key: sv.id,
            onClick: function() { setSel(sv); setView("book-date"); },
            style: s.serviceCard,
            className: "fade-up fade-up-" + (idx + 1)
          },
            e("div", { style: { fontSize:28, marginBottom:8 } }, sv.icon),
            e("div", { style: s.serviceTop },
              e("h3", { style: s.serviceName }, sv.name),
              e("span", { style: s.servicePrice }, fmtPrice(sv.price))
            ),
            e("p", { style: s.serviceDesc }, sv.desc),
            e("div", { style: s.serviceBottom },
              e("span", { style: s.serviceDuration }, "⏱ " + sv.duration),
              e("span", { style: s.serviceArrow }, "→")
            )
          );
        })
      ),
      e("p", { style: s.comingSoon, className:"fade-up fade-up-5" }, "\u{1F9D6}‍♀️ Facials — Coming Soon")
    ),

    view === "book-date" && sel && e("div", { style: s.content },
      e("div", { style: s.selectedBanner, className:"fade-up" },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, fmtPrice(sel.price) + " · " + sel.duration)
      ),
      e("h2", { style: s.sectionTitle }, "Pick a Date"),
      e("div", { style: s.calendar, className:"fade-up fade-up-1" },
        e("div", { style: s.calHeader },
          e("button", { onClick: prevMonth, style: s.calNav }, "‹"),
          e("span", { style: s.calMonth }, MONTHS[cMonth] + " " + cYear),
          e("button", { onClick: nextMonth, style: s.calNav }, "›")
        ),
        e("div", { style: s.calDays },
          DAYS.map(function(d) { return e("div", { key: d, style: s.calDayLabel }, d); })
        ),
        e("div", { style: s.calGrid },
          days.map(function(day, i) {
            return e("button", {
              key: i,
              disabled: !isAvail(day),
              onClick: function() { if (isAvail(day)) { setSelDate(day); setView("book-slot"); } },
              style: Object.assign({},
                s.calDay,
                day === null ? s.calDayEmpty : {},
                !isAvail(day) && day !== null ? s.calDayDisabled : {},
                isAvail(day) ? s.calDayAvailable : {},
                selDate === day && day !== null ? s.calDaySelected : {}
              )
            }, day || "");
          })
        )
      )
    ),

    view === "book-slot" && sel && selDate && e("div", { style: s.content },
      e("div", { style: s.selectedBanner, className:"fade-up" },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }))
      ),
      e("h2", { style: s.sectionTitle }, "Choose a Time"),
      e("div", { style: s.slotGrid },
        slots.map(function(slot, idx) {
          return e("button", {
            key: slot,
            onClick: function() { setSelSlot(slot); setView("book-details"); },
            style: Object.assign({}, s.slotBtn, selSlot === slot ? s.slotBtnSelected : {}),
            className: "fade-up fade-up-" + (idx < 5 ? idx + 1 : 5)
          }, slot);
        })
      )
    ),

    view === "book-details" && sel && selDate && selSlot && e("div", { style: s.content },
      e("div", { style: s.selectedBanner, className:"fade-up" },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }) + " at " + selSlot)
      ),
      e("h2", { style: s.sectionTitle }, "Your Details"),
      e("div", { style: s.formGroup, className:"fade-up fade-up-1" },
        e("label", { style: s.label }, "Full Name"),
        e("input", { type:"text", value: name, onChange: function(ev) { setName(ev.target.value); }, placeholder:"e.g. Sarah Jones", style: s.input })
      ),
      e("div", { style: s.formGroup, className:"fade-up fade-up-2" },
        e("label", { style: s.label }, "Phone Number"),
        e("input", { type:"tel", value: phone, onChange: function(ev) { setPhone(ev.target.value); }, placeholder:"e.g. 07700 900123", style: s.input })
      ),
      e("div", { style: s.summaryBox, className:"fade-up fade-up-3" },
        e("p", { style: s.summaryTitle }, "Booking Summary"),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Service"), e("span", { style:{fontWeight:500} }, sel.name)),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Date"), e("span", { style:{fontWeight:500} }, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" }))),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Time"), e("span", { style:{fontWeight:500} }, selSlot)),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Duration"), e("span", { style:{fontWeight:500} }, sel.duration)),
        e("div", { style: { ...s.summaryRow, borderBottom:"none", fontWeight:700, fontSize:15 } }, e("span", null, "Total"), e("span", { style:{color:"var(--accent)"} }, fmtPrice(sel.price)))
      ),
      e("button", {
        onClick: handleConfirm,
        disabled: !name.trim() || !phone.trim(),
        style: Object.assign({}, s.confirmBtn, { opacity: (!name.trim() || !phone.trim()) ? 0.4 : 1 }),
        className:"fade-up fade-up-4"
      }, "Confirm Booking"),
      e("p", { style: { fontSize:11, color:"var(--fg-faint)", textAlign:"center", marginTop:10, fontWeight:300 } }, "By booking, you agree to the cancellation policy")
    ),

    e(Footer)
  );
}


/* ═══════════════════════════════════════
   MAIN APP (ROUTER)
   ═══════════════════════════════════════ */

function App() {
  var mode = useState(window.location.hash === "#admin" ? "admin" : "customer");
  var appMode = mode[0]; var setAppMode = mode[1];
  var auth = useState(false); var isAuth = auth[0]; var setIsAuth = auth[1];

  useEffect(function() {
    function onHash() {
      if (window.location.hash === "#admin") {
        setAppMode("admin");
        document.getElementById("root").classList.add("admin-mode");
      } else {
        setAppMode("customer");
        setIsAuth(false);
        document.getElementById("root").classList.remove("admin-mode");
      }
    }
    window.addEventListener("hashchange", onHash);
    if (window.location.hash === "#admin") document.getElementById("root").classList.add("admin-mode");
    return function() { window.removeEventListener("hashchange", onHash); };
  }, []);

  if (appMode === "admin") {
    if (!isAuth) {
      return e(AdminLogin, { onLogin: function() { setIsAuth(true); } });
    }
    return e(AdminPanel, {
      onLogout: function() {
        setIsAuth(false);
        window.location.hash = "";
        setAppMode("customer");
        document.getElementById("root").classList.remove("admin-mode");
      }
    });
  }

  return e(CustomerApp);
}

ReactDOM.render(e(App), document.getElementById("root"));
</script>
