<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>abigaillnails | Book Your Appointment</title>
<meta name="description" content="Home-based nail care in the heart of the Chilterns. Book BIAB manicures, gel pedicures and more with Abigail in Stokenchurch, Buckinghamshire.">
<meta name="theme-color" content="#E8A0BF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💅</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column mobile-first booking flow, 420px max */
:root {
  --bg: #FAFAFA;
  --bg-card: #fff;
  --fg: #1a1a1a;
  --fg-muted: #777;
  --fg-faint: #999;
  --fg-ghost: #bbb;
  --accent: #E8A0BF;
  --accent-deep: #d4789e;
  --accent-wash: #fdf2f7;
  --accent-wash-mid: #fce8f0;
  --border: #f0f0f0;
  --border-accent: #f0e0ea;
  --input-border: #e0e0e0;
  --policy-bg: #FFF8E1;
  --policy-border: #FFE082;
  --policy-title: #F57F17;
  --confirm-green: #2E7D32;
  --whatsapp-bg: #E8F5E9;
  --disabled: #ddd;
  --coming-bg: #f9f9f9;
  --coming-border: #e0e0e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618;
    --bg-card: #1e1e22;
    --fg: #e8e8ec;
    --fg-muted: #a0a0a8;
    --fg-faint: #787880;
    --fg-ghost: #555;
    --accent: #E8A0BF;
    --accent-deep: #d4789e;
    --accent-wash: #2a1e24;
    --accent-wash-mid: #2e1f28;
    --border: #2a2a2e;
    --border-accent: #3a2a32;
    --input-border: #3a3a3e;
    --policy-bg: #2a2618;
    --policy-border: #5a4e2a;
    --policy-title: #FFB74D;
    --confirm-green: #66BB6A;
    --whatsapp-bg: #1e2e1e;
    --disabled: #444;
    --coming-bg: #1e1e22;
    --coming-border: #333;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618;
  --bg-card: #1e1e22;
  --fg: #e8e8ec;
  --fg-muted: #a0a0a8;
  --fg-faint: #787880;
  --fg-ghost: #555;
  --accent: #E8A0BF;
  --accent-deep: #d4789e;
  --accent-wash: #2a1e24;
  --accent-wash-mid: #2e1f28;
  --border: #2a2a2e;
  --border-accent: #3a2a32;
  --input-border: #3a3a3e;
  --policy-bg: #2a2618;
  --policy-border: #5a4e2a;
  --policy-title: #FFB74D;
  --confirm-green: #66BB6A;
  --whatsapp-bg: #1e2e1e;
  --disabled: #444;
  --coming-bg: #1e1e22;
  --coming-border: #333;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#root {
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const { useState } = React;

const SERVICES = [
  { id: 1, name: "BIAB Manicure", duration: "1 hr 15 min", price: "£42", category: "nails", desc: "Builder gel manicure for natural nail strength and a flawless finish" },
  { id: 2, name: "BIAB Manicure with Art", duration: "1 hr 30 min", price: "£48", category: "nails", desc: "Builder gel manicure with bespoke nail art designs" },
  { id: 3, name: "Gel Toe Paint", duration: "45 min", price: "£40", category: "nails", desc: "Gel polish application for perfectly polished toes" },
  { id: 4, name: "Gel Pedicure", duration: "1 hr", price: "£48", category: "nails", desc: "Full gel pedicure with foot care and polish" },
];

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SLOTS = ["09:00","10:30","12:00","13:30","15:00","16:30"];

function genDays(y,m){ const f=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate(), d=[]; for(let i=0;i<f;i++) d.push(null); for(let i=1;i<=n;i++) d.push(i); return d; }

const s = {
  header: { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px 20px", background:"var(--bg-card)", borderBottom:"1px solid var(--border)", position:"sticky", top:0, zIndex:10 },
  logoArea: { display:"flex", alignItems:"center", gap:12 },
  logoCircle: { width:40, height:40, borderRadius:"50%", background:"linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:700, fontSize:14, letterSpacing:1 },
  brandName: { fontSize:16, fontWeight:700, margin:0, letterSpacing:-0.3 },
  tagline: { fontSize:11, color:"var(--fg-faint)", margin:0 },
  backBtn: { background:"none", border:"none", color:"var(--accent)", fontSize:14, fontWeight:500, cursor:"pointer", padding:"4px 8px" },
  content: { flex:1, padding:"0 20px 24px" },
  heroBanner: { background:"linear-gradient(135deg, var(--accent-wash) 0%, var(--accent-wash-mid) 50%, var(--accent-wash) 100%)", borderRadius:16, padding:"32px 24px", textAlign:"center", margin:"16px 0" },
  heroTitle: { fontSize:22, fontWeight:700, margin:0, letterSpacing:-0.5 },
  heroSub: { fontSize:13, color:"var(--fg-muted)", margin:"8px 0 0", fontWeight:400 },
  primaryAction: { width:"100%", padding:"18px 20px", background:"var(--fg)", color:"var(--bg)", border:"none", borderRadius:14, display:"flex", flexDirection:"column", alignItems:"center", gap:4, cursor:"pointer", fontSize:15 },
  infoCards: { display:"flex", flexDirection:"column", gap:10 },
  infoCard: { display:"flex", gap:14, padding:"14px 16px", background:"var(--bg-card)", borderRadius:12, border:"1px solid var(--border)", alignItems:"flex-start" },
  infoIcon: { fontSize:20, marginTop:2 },
  infoTitle: { fontSize:13, fontWeight:600, margin:0 },
  infoText: { fontSize:12, color:"var(--fg-muted)", margin:"2px 0 0" },
  policyBox: { marginTop:20, padding:"14px 16px", background:"var(--policy-bg)", borderRadius:12, border:"1px solid var(--policy-border)" },
  policyTitle: { fontSize:13, fontWeight:600, margin:0, color:"var(--policy-title)" },
  policyText: { fontSize:12, color:"var(--fg-muted)", margin:"4px 0 0" },
  sectionTitle: { fontSize:18, fontWeight:700, margin:"20px 0 12px", letterSpacing:-0.3 },
  serviceList: { display:"flex", flexDirection:"column", gap:10 },
  serviceCard: { background:"var(--bg-card)", border:"1px solid var(--border)", borderRadius:14, padding:"16px 18px", cursor:"pointer", textAlign:"left", width:"100%" },
  serviceTop: { display:"flex", justifyContent:"space-between", alignItems:"center" },
  serviceName: { fontSize:15, fontWeight:600, margin:0 },
  servicePrice: { fontSize:15, fontWeight:700, color:"var(--accent)" },
  serviceDesc: { fontSize:12, color:"var(--fg-faint)", margin:"6px 0" },
  serviceBottom: { display:"flex", justifyContent:"space-between", alignItems:"center" },
  serviceDuration: { fontSize:12, color:"var(--fg-ghost)" },
  comingSoon: { textAlign:"center", fontSize:13, color:"var(--fg-ghost)", marginTop:20, padding:12, background:"var(--coming-bg)", borderRadius:10, border:"1px dashed var(--coming-border)" },
  selectedBanner: { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 16px", background:"var(--bg-card)", borderRadius:12, border:"1px solid var(--border)", margin:"16px 0 8px", fontSize:14 },
  calendar: { background:"var(--bg-card)", borderRadius:14, padding:16, border:"1px solid var(--border)" },
  calHeader: { display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 },
  calMonth: { fontSize:15, fontWeight:600 },
  calNav: { background:"none", border:"none", fontSize:22, cursor:"pointer", color:"var(--accent)", padding:"4px 12px", fontWeight:700 },
  calDays: { display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:2 },
  calDayLabel: { fontSize:11, fontWeight:600, color:"var(--fg-ghost)", textAlign:"center", padding:"4px 0" },
  calGrid: { display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:4 },
  calDay: { width:"100%", aspectRatio:"1", border:"none", borderRadius:10, fontSize:13, fontWeight:500, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", background:"transparent", color:"var(--fg)" },
  calDayEmpty: { cursor:"default" },
  calDayDisabled: { color:"var(--disabled)", cursor:"not-allowed" },
  calDayAvailable: { background:"var(--accent-wash)" },
  calDaySelected: { background:"var(--accent)", color:"#fff", fontWeight:700 },
  slotGrid: { display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10 },
  slotBtn: { padding:"14px 8px", borderRadius:12, border:"1px solid var(--border)", background:"var(--bg-card)", fontSize:15, fontWeight:500, cursor:"pointer", textAlign:"center", color:"var(--fg)" },
  slotBtnSelected: { background:"var(--accent)", color:"#fff", borderColor:"var(--accent)" },
  formGroup: { marginBottom:16 },
  label: { fontSize:13, fontWeight:500, display:"block", marginBottom:6, color:"var(--fg-muted)" },
  input: { width:"100%", padding:"12px 14px", borderRadius:12, border:"1px solid var(--input-border)", fontSize:15, outline:"none", boxSizing:"border-box", fontFamily:"inherit", background:"var(--bg-card)", color:"var(--fg)" },
  summaryBox: { background:"var(--accent-wash)", borderRadius:14, padding:"16px 18px", margin:"20px 0" },
  summaryTitle: { fontSize:14, fontWeight:700, margin:"0 0 10px" },
  summaryRow: { display:"flex", justifyContent:"space-between", fontSize:13, padding:"6px 0", borderBottom:"1px solid var(--border-accent)" },
  summaryLabel: { color:"var(--fg-faint)" },
  confirmBtn: { width:"100%", padding:16, borderRadius:14, border:"none", background:"var(--fg)", color:"var(--bg)", fontSize:16, fontWeight:600, cursor:"pointer" },
  confirmationCard: { flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"40px 24px" },
  h2: { fontSize:20, fontWeight:700, margin:0 },
  confirmText: { fontSize:14, color:"var(--fg-muted)", textAlign:"center", margin:"8px 0 20px" },
  confirmDetail: { width:"100%", background:"var(--bg-card)", borderRadius:14, border:"1px solid var(--border)", padding:"16px 18px" },
  confirmRow: { display:"flex", justifyContent:"space-between", fontSize:13, padding:"8px 0", borderBottom:"1px solid var(--border)" },
  confirmLabel: { color:"var(--fg-faint)" },
  whatsappBanner: { display:"flex", alignItems:"center", gap:10, background:"var(--whatsapp-bg)", borderRadius:12, padding:"12px 16px", marginTop:16, width:"100%", boxSizing:"border-box" },
  btnSecondary: { marginTop:20, padding:"12px 32px", borderRadius:12, border:"1px solid var(--input-border)", background:"var(--bg-card)", fontSize:14, fontWeight:500, cursor:"pointer", color:"var(--fg-muted)" },
  footer: { padding:"20px 24px", textAlign:"center", borderTop:"1px solid var(--border)", background:"var(--bg-card)", marginTop:"auto" },
  footerLink: { fontSize:12, color:"var(--accent)", cursor:"pointer", fontWeight:500 },
};

function Footer() {
  return e("footer", { style: s.footer },
    e("div", null,
      e("p", { style: { fontSize:11, color:"var(--fg-ghost)" } }, "@abigaillnails · Stokenchurch, Bucks"),
      e("div", { style: { display:"flex", gap:16, justifyContent:"center", margin:"8px 0" } },
        e("a", { href:"https://www.instagram.com/abigaillnails/", target:"_blank", rel:"noopener", style: s.footerLink }, "Instagram"),
        e("span", { style: s.footerLink }, "WhatsApp")
      ),
      e("p", { style: { fontSize:10, color:"var(--fg-faint)", marginTop:4 } }, "Built by Symplify Solutions")
    )
  );
}

function App() {
  const [view, setView] = useState("home");
  const [sel, setSel] = useState(null);
  const [selDate, setSelDate] = useState(null);
  const [selSlot, setSelSlot] = useState(null);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [confirmed, setConfirmed] = useState(false);
  const [cMonth, setCMonth] = useState(new Date().getMonth());
  const [cYear, setCYear] = useState(new Date().getFullYear());

  const today = new Date();
  const days = genDays(cYear, cMonth);

  const isAvail = (d) => {
    if (!d) return false;
    const dt = new Date(cYear, cMonth, d);
    const dow = dt.getDay();
    if (dow === 0 || dow === 6) return false;
    if (dt < new Date(today.getFullYear(), today.getMonth(), today.getDate())) return false;
    return true;
  };

  const handleConfirm = () => { if (name.trim() && phone.trim()) setConfirmed(true); };
  const resetAll = () => { setView("home"); setSel(null); setSelDate(null); setSelSlot(null); setName(""); setPhone(""); setConfirmed(false); };
  const prevMonth = () => { if (cMonth===0){setCMonth(11);setCYear(cYear-1)} else setCMonth(cMonth-1) };
  const nextMonth = () => { if (cMonth===11){setCMonth(0);setCYear(cYear+1)} else setCMonth(cMonth+1) };

  const goBack = () => {
    if (view==="book-slot") setView("book-date");
    else if (view==="book-date") setView("services");
    else if (view==="book-details") setView("book-slot");
    else setView("home");
  };

  if (confirmed) {
    const dateStr = new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });
    return e("div", { id: "app-root", style: { display:"flex", flexDirection:"column", minHeight:"100vh" } },
      e("div", { style: s.confirmationCard },
        e("div", { style: { fontSize:48, marginBottom:16 } }, "✓"),
        e("h2", { style: { ...s.h2, color:"var(--confirm-green)", marginBottom:8 } }, "Booking Confirmed!"),
        e("p", { style: s.confirmText }, "Thank you, " + name + ". Your appointment has been booked."),
        e("div", { style: s.confirmDetail },
          e("div", { style: s.confirmRow }, e("span", { style: s.confirmLabel }, "Service"), e("span", null, sel.name)),
          e("div", { style: s.confirmRow }, e("span", { style: s.confirmLabel }, "Date"), e("span", null, dateStr)),
          e("div", { style: s.confirmRow }, e("span", { style: s.confirmLabel }, "Time"), e("span", null, selSlot)),
          e("div", { style: s.confirmRow }, e("span", { style: s.confirmLabel }, "Duration"), e("span", null, sel.duration))
        ),
        e("div", { style: s.whatsappBanner },
          e("span", { style: { fontSize:20 } }, "💬"),
          e("span", { style: { fontSize:13 } }, "A WhatsApp confirmation will be sent to " + phone)
        ),
        e("p", { style: { fontSize:12, color:"var(--fg-faint)", marginTop:16, textAlign:"center" } }, "You'll also receive a reminder 24 hours before your appointment"),
        e("button", { onClick: resetAll, style: s.btnSecondary }, "Back to Home")
      ),
      e(Footer)
    );
  }

  return e("div", { id: "app-root", style: { display:"flex", flexDirection:"column", minHeight:"100vh" } },
    // Header
    e("header", { style: s.header },
      e("div", { style: s.logoArea },
        e("div", { style: s.logoCircle }, "AN"),
        e("div", null,
          e("h1", { style: s.brandName }, "abigaillnails"),
          e("p", { style: s.tagline }, "Stokenchurch, Bucks")
        )
      ),
      view !== "home" && e("button", { onClick: goBack, style: s.backBtn }, "← Back")
    ),

    // HOME
    view === "home" && e("div", { style: s.content },
      e("div", { style: s.heroBanner },
        e("h2", { style: s.heroTitle }, "Book Your Appointment"),
        e("p", { style: s.heroSub }, "Home-based nail care in the heart of the Chilterns")
      ),
      e("div", { style: { marginBottom:20 } },
        e("button", { onClick: () => setView("services"), style: s.primaryAction },
          e("span", { style: { fontSize:22 } }, "💅"),
          e("span", { style: { fontWeight:600 } }, "Book Now"),
          e("span", { style: { fontSize:12, color:"var(--fg-faint)" } }, "View services & availability")
        )
      ),
      e("div", { style: s.infoCards },
        e("div", { style: s.infoCard },
          e("span", { style: s.infoIcon }, "📍"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Location"),
            e("p", { style: s.infoText }, "Home-based in Stokenchurch, Buckinghamshire. Address shared upon booking.")
          )
        ),
        e("div", { style: s.infoCard },
          e("span", { style: s.infoIcon }, "⏰"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Opening Hours"),
            e("p", { style: s.infoText }, "Mon–Fri, 9:00–18:00. Appointments only.")
          )
        ),
        e("div", { style: s.infoCard },
          e("span", { style: s.infoIcon }, "💬"),
          e("div", null,
            e("p", { style: s.infoTitle }, "Get in Touch"),
            e("p", { style: s.infoText }, "WhatsApp for enquiries, changes, or cancellations.")
          )
        )
      ),
      e("div", { style: s.policyBox },
        e("p", { style: s.policyTitle }, "Booking Policy"),
        e("p", { style: s.policyText }, "Please provide at least 24 hours' notice for cancellations or changes. Late cancellations or no-shows may affect future booking availability.")
      )
    ),

    // SERVICES
    view === "services" && e("div", { style: s.content },
      e("h2", { style: s.sectionTitle }, "Choose a Service"),
      e("div", { style: s.serviceList },
        SERVICES.map(sv =>
          e("button", { key: sv.id, onClick: () => { setSel(sv); setView("book-date"); }, style: s.serviceCard },
            e("div", { style: s.serviceTop },
              e("h3", { style: s.serviceName }, sv.name),
              e("span", { style: s.servicePrice }, sv.price)
            ),
            e("p", { style: s.serviceDesc }, sv.desc),
            e("div", { style: s.serviceBottom },
              e("span", { style: s.serviceDuration }, "⏱ " + sv.duration)
            )
          )
        )
      ),
      e("p", { style: s.comingSoon }, "🧖‍♀️ Facials — Coming Soon")
    ),

    // DATE PICKER
    view === "book-date" && sel && e("div", { style: s.content },
      e("div", { style: s.selectedBanner },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, sel.price + " · " + sel.duration)
      ),
      e("h2", { style: s.sectionTitle }, "Pick a Date"),
      e("div", { style: s.calendar },
        e("div", { style: s.calHeader },
          e("button", { onClick: prevMonth, style: s.calNav }, "‹"),
          e("span", { style: s.calMonth }, MONTHS[cMonth] + " " + cYear),
          e("button", { onClick: nextMonth, style: s.calNav }, "›")
        ),
        e("div", { style: s.calDays },
          DAYS.map(d => e("div", { key: d, style: s.calDayLabel }, d))
        ),
        e("div", { style: s.calGrid },
          days.map((day, i) =>
            e("button", {
              key: i,
              disabled: !isAvail(day),
              onClick: () => { if (isAvail(day)) { setSelDate(day); setView("book-slot"); } },
              style: {
                ...s.calDay,
                ...(day === null ? s.calDayEmpty : {}),
                ...(!isAvail(day) && day !== null ? s.calDayDisabled : {}),
                ...(isAvail(day) ? s.calDayAvailable : {}),
                ...(selDate === day && day !== null ? s.calDaySelected : {}),
              }
            }, day || "")
          )
        )
      )
    ),

    // TIME SLOTS
    view === "book-slot" && sel && selDate && e("div", { style: s.content },
      e("div", { style: s.selectedBanner },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }))
      ),
      e("h2", { style: s.sectionTitle }, "Choose a Time"),
      e("div", { style: s.slotGrid },
        SLOTS.map(slot =>
          e("button", {
            key: slot,
            onClick: () => { setSelSlot(slot); setView("book-details"); },
            style: { ...s.slotBtn, ...(selSlot === slot ? s.slotBtnSelected : {}) }
          }, slot)
        )
      ),
      e("p", { style: { fontSize:12, color:"var(--fg-faint)", textAlign:"center", marginTop:12 } }, "Slots shown are examples — live availability will sync with Abigail's calendar")
    ),

    // DETAILS FORM
    view === "book-details" && sel && selDate && selSlot && e("div", { style: s.content },
      e("div", { style: s.selectedBanner },
        e("span", { style: { fontWeight:600 } }, sel.name),
        e("span", { style: { color:"var(--accent)" } }, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }) + " at " + selSlot)
      ),
      e("h2", { style: s.sectionTitle }, "Your Details"),
      e("div", { style: s.formGroup },
        e("label", { style: s.label }, "Full Name"),
        e("input", { id: "name-input", type:"text", value: name, onChange: ev => setName(ev.target.value), placeholder:"e.g. Sarah Jones", style: s.input })
      ),
      e("div", { style: s.formGroup },
        e("label", { style: s.label }, "Phone Number (for WhatsApp confirmation)"),
        e("input", { id: "phone-input", type:"tel", value: phone, onChange: ev => setPhone(ev.target.value), placeholder:"e.g. 07700 900123", style: s.input })
      ),
      e("div", { style: s.summaryBox },
        e("p", { style: s.summaryTitle }, "Booking Summary"),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Service"), e("span", null, sel.name)),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Date"), e("span", null, new Date(cYear, cMonth, selDate).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" }))),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Time"), e("span", null, selSlot)),
        e("div", { style: s.summaryRow }, e("span", { style: s.summaryLabel }, "Duration"), e("span", null, sel.duration)),
        e("div", { style: { ...s.summaryRow, borderBottom:"none", fontWeight:600 } }, e("span", null, "Price"), e("span", null, sel.price))
      ),
      e("button", { onClick: handleConfirm, disabled: !name.trim() || !phone.trim(), style: { ...s.confirmBtn, opacity: (!name.trim() || !phone.trim()) ? 0.5 : 1 } }, "Confirm Booking"),
      e("p", { style: { fontSize:11, color:"var(--fg-faint)", textAlign:"center", marginTop:8 } }, "By booking, you agree to the cancellation policy")
    ),

    e(Footer)
  );
}

ReactDOM.render(e(App), document.getElementById("root"));
</script>
</body>
</html>
